[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = 'py310'
line-length = 88

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I']

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = '3.10'
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
